name: Build Windows installer

# Builds the Infocat Terminal Windows .exe installer in the cloud.
# node-pty compiles natively on the Windows runner, so you need no local toolchain.
#
# Runs on:
#   - every push of a version tag like v0.1.0  -> also attaches the .exe to a GitHub Release
#   - manual "Run workflow" button (Actions tab) -> uploads the .exe as a build artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          # Skip electron-builder code signing (no certificate configured).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infocat-Terminal-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
